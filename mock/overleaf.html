<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock Overleaf</title>
<!-- (Overleaf's own: Bootstrap 5 and Material Symbols, which the extension's toolbar markup uses) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0">
<style>
  .material-symbols { font-family: "Material Symbols Rounded"; font-size: 20px; line-height: 1; font-feature-settings: "liga"; -webkit-font-smoothing: antialiased; }
  .toolbar-pdf .btn-link, .toolbar-pdf .btn-link:hover { color: #fff; text-decoration: none; }
  .toolbar-pdf .pdf-toolbar-btn { padding: 4px 6px; }
  /* Overleaf's PDF viewer controls (pdfjs-*), as its stylesheet lays them out */
  .toolbar-pdf-right { display: flex; align-items: center; justify-content: flex-end; min-width: 0; }
  .pdfjs-viewer-controls { display: flex; align-items: center; gap: 2px; color: #fff; }
  .pdfjs-toolbar-buttons { display: flex; }
  .toolbar-pdf .btn-ghost, .toolbar-pdf .btn-ghost:hover { color: #fff; border: 0; }
  .pdfjs-page-number-input { display: flex; align-items: center; gap: 4px; white-space: nowrap; font-size: 13px; }
  .pdfjs-page-number-input form { margin: 0; }
  .pdfjs-page-number-input input { width: 32px; height: 26px; text-align: center; border: 1px solid #6c7380; border-radius: 4px; background: #fff; color: #1b222c; padding: 0; }
  .pdfjs-zoom-controls { display: flex; align-items: center; }
  .pdfjs-zoom-dropdown-button { color: #fff !important; white-space: nowrap; }
  /* Overleaf's toggle switch: two radio labels in a pill */
  .toggle-switch { display: inline-flex; background: #495365; border-radius: 9999px; padding: 2px; font-size: 13px; }
  .toggle-switch-input { position: absolute; opacity: 0; pointer-events: none; }
  .toggle-switch-label { padding: 2px 10px; border-radius: 9999px; color: #fff; cursor: pointer; margin: 0; }
  .toggle-switch-input:checked + .toggle-switch-label { background: #fff; color: #1b222c; }
  body { margin: 0; font: 14px system-ui, sans-serif; display: grid; grid-template-columns: 200px 1fr 1fr; height: 100vh; }
  nav { border-right: 1px solid #ddd; padding: 8px; background: #f7f7f7; }
  .file-tree-list { list-style: none; padding: 0; }
  [role=treeitem] { padding: 3px 6px; cursor: pointer; border-radius: 3px; }
  [role=treeitem][aria-selected=true] { background: #138a07; color: #fff; }
  main { display: flex; flex-direction: column; }
  .bar { padding: 6px; border-bottom: 1px solid #ddd; display: flex; gap: 6px; }
  .cm-editor { flex: 1; display: flex; }
  /* Overleaf's PDF pane, as far as the extension docks into it: .pdf, its .toolbar-pdf (left: compile group; right), .pdf-viewer */
  .pdf { position: relative; display: flex; flex-direction: column; border-left: 1px solid #ddd; background: #3c4b5c; min-width: 0; }
  .toolbar-pdf { display: flex; justify-content: space-between; align-items: center; height: 40px; padding: 0 6px; background: #1b222c; color: #fff; }
  .toolbar-pdf-left { display: flex; align-items: center; gap: 6px; }
  .compile-button-group button { background: #138a07; color: #fff; border: 0; border-radius: 9999px; padding: 4px 12px; font-weight: 600; }
  .pdf-viewer { flex: 1; display: grid; place-items: center; color: #c9d1d9; font-size: 13px; }
  .cm-content { flex: 1; font: 13px/1.5 ui-monospace, monospace; border: 0; padding: 8px; resize: none; }
</style>
</head>
<body>
<nav>
  <b>Mock Overleaf</b>
  <p style="color:#666;font-size:12px">The DOM surface the extension reads: the file tree, <code>.cm-content.cmView.view</code>, and the project endpoints.</p>
  <ul class="list-unstyled file-tree-folder-list file-tree-list" role="tree" id="tree"></ul>
  <div class="outline-container"><b style="font-size:12px">File outline</b><ul class="outline-item-list" id="outline" style="list-style:none;padding:0 0 0 4px;font-size:12px"></ul></div>
</nav>
<main>
  <div class="bar">
    <button id="collab" title="A remote transaction: two changes at once, non-ASCII">Collaborator edit</button>
    <span id="info" style="color:#666"></span>
  </div>
  <div class="cm-editor"><textarea class="cm-content" spellcheck="false"></textarea></div>
</main>
<div class="pdf full-size">
  <div class="toolbar-pdf"><div class="toolbar-pdf-left"><div class="compile-button-group"><button type="button" id="recompile" title="Compile with the local pdflatex, as Overleaf compiles">Recompile</button></div></div><div class="toolbar-pdf-right"></div></div>
  <div class="pdf-viewer" id="olpdf">Overleaf's PDF: press Recompile (the local pdflatex)</div>
</div>
<script type="module">
// A mock of CodeMirror 6's EditorView, as far as the extension uses it:
// state.doc, update(transactions) with changes.iterChanges, setState.
class Text {
  constructor(s) { this.s = s; }
  get length() { return this.s.length; }
  toString() { return this.s; }
  sliceString(a, b) { return this.s.slice(a, b); }
  get lines() { return this.s.split("\n").length; }
  line(n) {
    let from = 0;
    for (let k = 1; k < n; k++) from = this.s.indexOf("\n", from) + 1;
    const to = this.s.indexOf("\n", from);
    return { number: n, from, to: to < 0 ? this.s.length : to };
  }
}
/** Changes in the start doc's positions, sorted, not overlapping (as CM's). */
class ChangeSet {
  constructor(changes) { this.changes = changes; }
  get length() { return this.changes.length; }
  iterChanges(f) {
    let shift = 0;
    for (const c of this.changes) {
      const fromB = c.from + shift;
      f(c.from, c.to, fromB, fromB + c.insert.length, new Text(c.insert));
      shift += c.insert.length - (c.to - c.from);
    }
  }
  apply(s) {
    let out = "", at = 0;
    for (const c of this.changes) { out += s.slice(at, c.from) + c.insert; at = c.to; }
    return out + s.slice(at);
  }
}
class EditorView {
  constructor(el, doc) { this.el = el; this.state = { doc: new Text(doc) }; }
  update(trs) {
    for (const tr of trs) this.state = tr.state;
    if (this.el.value !== this.state.doc.toString()) this.el.value = this.state.doc.toString();
  }
  setState(s) { this.state = s; this.el.value = s.doc.toString(); }
  /** (the textarea's selection, as CM's state has it) */
  syncSelection() { this.state = { ...this.state, selection: { main: { anchor: this.el.selectionStart, head: this.el.selectionEnd } } }; }
  focus() { this.el.focus(); }
  dispatch(spec) {
    if (spec.selection) {
      const { anchor, head = anchor } = spec.selection;
      this.state = { ...this.state, selection: { main: { anchor, head } } };
      this.el.focus();
      this.el.setSelectionRange(Math.min(anchor, head), Math.max(anchor, head));
      if (!spec.changes) return;
    }
    const cs = new ChangeSet([].concat(spec.changes ?? []).sort((a, b) => a.from - b.from).map((c) => ({ from: c.from, to: c.to ?? c.from, insert: c.insert ?? "" })));
    const tr = { changes: cs, docChanged: cs.length > 0, state: { doc: new Text(cs.apply(this.state.doc.toString())) } };
    this.update([tr]);
  }
}

const ta = document.querySelector(".cm-content");
const view = new EditorView(ta, "");
ta.cmView = { view };
let docs = await (await fetch("/project/mock/docs")).json();
let current = null;

function renderTree() {
  const tree = document.getElementById("tree");
  tree.innerHTML = "";
  for (const d of docs) {
    const li = document.createElement("li");
    li.setAttribute("role", "treeitem");
    li.setAttribute("aria-label", d.path);
    li.setAttribute("aria-selected", String(d.id === current?.id));
    li.innerHTML = `<div class="entity" data-file-id="${d.id}" data-file-type="doc"><div class="item-name"><span></span></div></div>`;
    li.querySelector("span").textContent = d.path;
    li.onclick = () => openDoc(d);
    tree.append(li);
  }
}
async function save() {
  if (!current) return;
  current.text = view.state.doc.toString();
  await fetch(`/project/mock/doc/${current.id}`, { method: "POST", body: current.text });
}
async function openDoc(d) {
  await save();
  current = d;
  const fresh = await (await fetch(`/project/mock/doc/${d.id}/download`)).text();
  view.setState({ doc: new Text(fresh) });
  prev = fresh;
  renderTree();
  renderOutline();
}

// The file outline, as Overleaf's: the open file's headings; a click puts
// the cursor at the heading (Overleaf's does the same).
function renderOutline() {
  const ul = document.getElementById("outline");
  ul.innerHTML = "";
  const t = view.state.doc.toString();
  for (const m of t.matchAll(/\\(part|chapter|section|subsection|subsubsection)\*?\{([^}]*)\}/g)) {
    const li = document.createElement("li");
    li.className = "outline-item";
    li.style.paddingLeft = `${["part", "chapter", "section", "subsection", "subsubsection"].indexOf(m[1]) * 8}px`;
    const b = document.createElement("button");
    b.className = "outline-item-link";
    b.style.cssText = "border:0;background:none;cursor:pointer;text-align:left;padding:1px 0";
    b.textContent = m[2];
    b.onclick = () => view.dispatch({ selection: { anchor: m.index }, scrollIntoView: true });
    li.append(b);
    ul.append(li);
  }
}
for (const ev of ["select", "keyup", "mouseup", "dblclick"]) ta.addEventListener(ev, () => view.syncSelection());

// Typing: the textarea's change as one transaction (as CM would make).
let prev = "";
ta.addEventListener("input", () => {
  const s = ta.value;
  let a = 0; while (a < prev.length && a < s.length && prev[a] === s[a]) a++;
  let z = 0; while (z < prev.length - a && z < s.length - a && prev[prev.length - 1 - z] === s[s.length - 1 - z]) z++;
  view.dispatch({ changes: { from: a, to: prev.length - z, insert: s.slice(a, s.length - z) } });
  prev = s;
});
setInterval(save, 2000);

// Recompile: the local pdflatex, as Overleaf's compile; its PDF in the pane,
// and its download link where Overleaf's is (the extension's ▾ menu reads it)
document.getElementById("recompile").addEventListener("click", async () => {
  await save();
  const v = document.getElementById("olpdf");
  v.textContent = "Compiling (pdflatex)…";
  const r = await (await fetch("/project/mock/compile", { method: "POST" })).json();
  v.innerHTML = r.ok ? `<iframe title="Overleaf's PDF" style="width:100%;height:100%;border:0" src="/project/mock/output/output.pdf?${Date.now()}"></iframe>` : `pdflatex failed (${r.ms} ms): <a href="/project/mock/output/output.log" target="_blank">log</a>`;
  document.getElementById("oldl")?.remove();
  if (r.ok) {
    const a = document.createElement("a");
    a.id = "oldl";
    a.href = "/project/mock/output/output.pdf";
    a.setAttribute("aria-label", "Download PDF");
    a.className = "btn btn-link pdf-toolbar-btn";
    a.download = "output.pdf";
    a.innerHTML = '<span class="material-symbols">download</span>';
    document.querySelector(".toolbar-pdf-left").append(a);
  }
});

document.getElementById("collab").onclick = () => {
  const n = view.state.doc.length;
  view.dispatch({ changes: [{ from: 0, insert: "% ✎ collaborator 😀\n" }, { from: Math.floor(n / 2), to: Math.floor(n / 2), insert: " (ünïcode) " }] });
  prev = view.state.doc.toString();
};

// For tests driving the page: type as a user would, at a UTF-16 position.
window.mockEditor = {
  view,
  type(at, text) { view.dispatch({ changes: { from: at, insert: text } }); prev = view.state.doc.toString(); },
  replace(from, to, text) { view.dispatch({ changes: { from, to, insert: text } }); prev = view.state.doc.toString(); },
  multi(changes) { view.dispatch({ changes }); prev = view.state.doc.toString(); },
  open: (path) => openDoc(docs.find((d) => d.path === path)),
  text: () => view.state.doc.toString(),
};
// (the main file: main.tex, else the doc with \documentclass)
await openDoc(docs.find((d) => d.path === "main.tex") ?? docs.find((d) => /\\documentclass/.test(d.text)) ?? docs[0]);
document.getElementById("info").textContent = "Mock: edits kept in the mock server's memory.";
</script>
</body>
</html>
